<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">

<meta name="viewport"
content="
width=device-width,
initial-scale=1,
viewport-fit=cover,
maximum-scale=1,
user-scalable=no
">

<title>Angux AI - Composer</title>

<style>

/* ==========================================
   1. 變數配置
   ========================================== */
:root {
  --composer-footer_height: 32px;
  --composer-bar_height: 52px;
  --composer-bar_width: 768px;
  --composer-bar_safe-margins: 20px;
  --scrollbar-width: 10px;
  --container-max-width: 20rem; 
}

/* ==========================================
   2. 基礎重設
   ========================================== */
*{
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

/* 讓最外層底色變黑，不給任何 padding，避免干擾 */
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

/* ==========================================
   3. 頁面整體佈局 (徹底解決重疊的關鍵)
   ========================================== */
.app-layout {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  
  /* 🛠️ 關鍵修正：將安全區域寫在這裡，並額外多加上 24px 的緩衝距離，確保絕對不跟時間重疊 */
  padding-top: calc(env(safe-area-inset-top) + 24px);
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
}

/* 頂部功能列 */
.header-bar {
  width: 100%;
  display: flex;
  justify-content: flex-end;
  padding: 0 var(--composer-bar_safe-margins);
  height: 40px;
  align-items: center;
}

.login-btn {
  color: #fff;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  background: rgba(255,255,255,0.1);
  padding: 6px 14px;
  border-radius: 20px;
}

/* 滾動內容區 */
.scroll-content {
  flex: 1;
  overflow-y: scroll;
  padding: 20px var(--composer-bar_safe-margins);
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;

  -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 85%, rgba(0,0,0,0) 100%);
  mask-image: linear-gradient(to top, rgba(0,0,0,1) 85%, rgba(0,0,0,0) 100%);
}

.scroll-content::-webkit-scrollbar {
  width: var(--scrollbar-width);
}
.scroll-content::-webkit-scrollbar-thumb {
  background: #333;
  border-radius: 5px;
}

/* 標題文字區塊 */
.title-container {
  width: 100%;
  max-width: var(--container-max-width);
  margin-bottom: 24px;
}

.title-text {
  font-size: clamp(22px, 3vh, 28px);
  font-weight: 500;
  letter-spacing: -0.5px;
}

/* ==========================================
   4. 輸入框區域 (Composer Parent)
   ========================================== */
.composer-parent {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  /* 🛠️ 關鍵修正：底部安全區獨立出來，避免寫在 body 導致語法失效 */
  padding-bottom: calc(env(safe-area-inset-bottom) + 12px);
}

.composer-bar {
  width: calc(100% - (var(--composer-bar_safe-margins) * 2));
  max-width: var(--composer-bar_width);
  height: var(--composer-bar_height);
  background: #1e1e1e;
  border-radius: 26px;
  display: flex;
  align-items: center;
  padding: 0 16px;
  margin-bottom: 8px;
}

.composer-input {
  flex: 1;
  background: transparent;
  border: none;
  color: #fff;
  font-size: 16px;
  outline: none;
}

.composer-input::placeholder {
  color: #666;
}

.icon-btn {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: none;
  background: transparent;
  color: #aaa;
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
}
.icon-btn.submit {
  background: #fff;
  color: #000;
}

.composer-footer {
  width: 100%;
  height: var(--composer-footer_height);
  display: flex;
  justify-content: center;
  align-items: center;
}

.footer-text {
  font-size: 11px;
  color: #555;
  text-align: center;
}
.footer-text a {
  color: #777;
  text-decoration: underline;
}

</style>
</head>

<body>

<div class="app-layout">

  <div class="header-bar">
    <div class="login-btn">登入</div>
  </div>

  <div class="scroll-content">
    <div class="title-container">
      <h1 class="title-text">我們該從哪裡開始？</h1>
    </div>
  </div>

  <div class="composer-parent">
    
    <div class="composer-bar">
      <button class="icon-btn" style="margin-right: 8px; font-size: 20px;">+</button>
      <input type="text" class="composer-input" placeholder="想問什麼都可以">
      <button class="icon-btn" style="margin-right: 4px;">🎙️</button>
      <button class="icon-btn submit">↑</button>
    </div>

    <div class="composer-footer">
      <p class="footer-text">
        傳送訊息至 Angux AI 即表示你同意我們的<a href="#">條款</a>和<a href="#">隱私權政策</a>
      </p>
    </div>

  </div>

</div>

</body>
</html>
