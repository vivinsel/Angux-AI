<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
viewport-fit=cover,
maximum-scale=1,
user-scalable=no">

<title>Angux AI</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{

width:100%;
height:100%;

background:#000;

overflow:hidden;

font-family:
-apple-system,
BlinkMacSystemFont,
sans-serif;

}

body{

display:flex;

justify-content:center;

align-items:center;

padding:
max(24px,env(safe-area-inset-top))
24px
max(24px,env(safe-area-inset-bottom));

}

.container{

width:100%;

display:flex;

justify-content:center;

align-items:center;

}

button{

width:82vw;

max-width:320px;

height:58px;

border:none;

border-radius:20px;

background:white;

color:black;

font-size:20px;

font-weight:700;

letter-spacing:0.5px;

-webkit-tap-highlight-color:transparent;

}

button:active{

transform:scale(0.98);

}

</style>

</head>

<body>

<div class="container">

<button onclick="openChatGPT()">
Open Angux AI
</button>

</div>

<script>

function openChatGPT(){

window.location.href =
"https://chatgpt.com";

}

</script>

</body>
</html>
