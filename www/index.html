<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">

<meta name="viewport"
content="
width=device-width,
initial-scale=1,
viewport-fit=cover,
maximum-scale=1,
user-scalable=no
">

<title>Angux AI</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color: transparent;
}

html,body{

width:100%;
height:100%;

overflow:hidden;

background:#000;

font-family:
-apple-system,
BlinkMacSystemFont,
sans-serif;

display:flex;
justify-content:center;
align-items:center;

/* 修正了原本 padding 的語法錯誤，改用標準的 env 寫法 */
padding: 
  calc(env(safe-area-inset-top) + 60px) 
  env(safe-area-inset-right) 
  calc(env(safe-area-inset-bottom) + 16px) 
  env(safe-area-inset-left);
}

.container{

width:100%;
height:100%;

display:flex;
flex-direction: column; /* 讓內容由上往下垂直排列 */
justify-content: flex-end; /* 讓整體內容靠底部對齊 */
align-items: center; /* 水平置中 */

padding: 6vw 6vw 6vh 6vw; /* 調整最後一個數值 (6vh) 可以控制按鈕距離底部的距離 */

}

/* 新增：標題文字的樣式 */
.title {
  color: #fff;
  font-size: clamp(20px, 3vh, 28px); /* 字體大小會根據螢幕高度縮放 */
  font-weight: 500;
  margin-bottom: 24px; /* 這裡的數值可以控制「文字」與「下方按鈕」之間的間距 */
  text-align: center;
  letter-spacing: 0.5px;
}

.button{

width:82vw;
max-width:360px;

height:7.2vh;
min-height:58px;
max-height:74px;

border:none;
border-radius:22px;

background:#fff;
color:#000;

font-size:clamp(14px,1.8vh,20px);

font-weight:700;

letter-spacing:0.5px;

display:flex;
justify-content:center;
align-items:center;

}

.button:active{
transform:scale(0.98);
}

</style>
</head>

<body>

<div class="container">

  <h1 class="title">我們該從哪裡開始？</h1>

  <button
  class="button"
  onclick="openChatGPT()">
  
  Open Angux AI
  
  </button>

<div class="login-btn">登入</div>

</div>

<script>

function openChatGPT(){

window.location.href =
"https://chatgpt.com";

}

</script>

</body>
</html>
