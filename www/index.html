<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">

<meta name="viewport"
content="
width=device-width,
initial-scale=1,
viewport-fit=cover,
maximum-scale=1,
user-scalable=no
">

<title>Angux AI</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color: transparent;
}

html,body{

width:100%;
height:100%;

overflow:hidden;

background:#000;

font-family:
-apple-system,
BlinkMacSystemFont,
sans-serif;

display:flex;
justify-content:center;
align-items:center;

padding:
calc(env(safe-area-inset-top) + 16px);
env(safe-area-inset-top)
env(safe-area-inset-right)
env(safe-area-inset-bottom)
env(safe-area-inset-left);

}

.container{

width:100%;
height:100%;

display:flex;
flex-direction: column; /* 確保內容是由上往下排列 */
justify-content: flex-end; /* 讓內容靠底部對齊 */
align-items: center; /* 水平依然置中 */

/* 調整這裡的 padding-bottom (最後一個數值) */
/* 8vh 代表距離螢幕底部 8% 的畫面高度，你可以自由調整這個數字 */
padding: 6vw 6vw 8vh 6vw; 

}

.button{

width:82vw;
max-width:360px;

height:7.2vh;
min-height:58px;
max-height:74px;

border:none;
border-radius:22px;

background:#fff;
color:#000;

font-size:clamp(14px,1.8vh,20px);

font-weight:700;

letter-spacing:0.5px;

display:flex;
justify-content:center;
align-items:center;

}

.button:active{
transform:scale(0.98);
}

</style>
</head>

<body>

<div class="container">

<button
class="button"
onclick="openChatGPT()">

Open Angux AI

</button>

</div>

<script>

function openChatGPT(){

window.location.href =
"https://chatgpt.com";

}

</script>

</body>
</html>
