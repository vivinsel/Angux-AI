<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<title>Angux AI</title>

<style>

*{
box-sizing:border-box;
}

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
background:black;
overflow:hidden;

display:flex;
justify-content:center;
align-items:center;

font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

.container{
width:100%;
padding:0 6vw;

display:flex;
justify-content:center;
align-items:center;
}

button{

width:100%;
max-width:320px;

padding:4.5vw 6vw;

font-size:clamp(16px,4.5vw,22px);

font-weight:700;

border:none;
border-radius:18px;

background:white;
color:black;

white-space:nowrap;

overflow:hidden;
text-overflow:ellipsis;

}

</style>
</head>

<body>

<div class="container">

<button onclick="openChatGPT()">
Open Angux AI
</button>

</div>

<script>

function openChatGPT(){

window.location.href =
"https://chatgpt.com";

}

</script>

</body>
</html>
