<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">

<meta
name="viewport"
content="
width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover
">

<title>Angux AI</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{

width:100%;
height:100%;

background:#000;

overflow:hidden;

font-family:
-apple-system,
BlinkMacSystemFont,
sans-serif;

display:flex;
justify-content:center;
align-items:center;

padding:
env(safe-area-inset-top)
16px
env(safe-area-inset-bottom)
16px;

}

/* 主容器 */

.container{

width:100%;
max-width:375px;

display:flex;
justify-content:center;
align-items:center;

}

/* 按鈕 */

button{

width:100%;

height:56px;

border:none;
border-radius:18px;

background:#fff;
color:#000;

font-size:18px;
font-weight:700;

letter-spacing:0.3px;

}

button:active{
transform:scale(0.98);
}

</style>
</head>

<body>

<div class="container">

<button onclick="openChatGPT()">
Open Angux AI
</button>

</div>

<script>

function openChatGPT(){

window.location.href =
"https://chatgpt.com";

}

</script>

</body>
</html>
